# Subagent models in the normal mode (CONTRIBUTING, Subagent models).
# One line per role or role/case: "<family> <effort>[, <family> <effort>...]".
# A family always means its latest model. The first entry is used; the next ones only when
# it is unavailable. Claude Code runs xhigh or max as high on a model that lacks them.
# families: haiku sonnet opus fable    (fable is not measured in this repository)
# efforts:  low medium high xhigh max  (haiku: high or above, owner rule)
aiu-scout: haiku xhigh, sonnet high
aiu-scout/why: sonnet high, opus medium        # the answer must explain why
aiu-runner: haiku high, sonnet high
aiu-implementer: opus high
aiu-implementer/small: sonnet high, opus high  # a small, fully specified brief
aiu-reviewer: opus high
aiu-reviewer/security: opus xhigh              # the diff touches a security-lifecycle area
