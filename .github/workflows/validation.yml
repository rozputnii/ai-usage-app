name: Bootstrap validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
    steps:
      - uses: actions/checkout@0c5077e51419868618aeaa5fe8019c62421857d6 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0; reads global.json
      - uses: oven-sh/setup-bun@3d3c42e5aac5ba805825da76410c181273ba90b1 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Validator regressions
        run: dotnet run --project tests/AiUsage.ProjectValidation.Tests
      - name: Canonical document validation
        run: dotnet run --project tools/AiUsage.ProjectValidation --no-build -- --root . --json
      - name: Workflow and actual patch regressions
        run: bun test tests/omp-workflow
