name: Validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      MsixVersion:
        description: Explicit reserved version for a manual unsigned smoke-candidate build
        required: false
        type: string
      PublishPreview:
        description: Publish a signed development Preview from this main commit
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # Release ancestry tests exercise HEAD and its actual parent.
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0; reads global.json
      - name: Validator regressions
        run: dotnet run --project tests/AiUsage.ProjectValidation.Tests
      - name: Canonical document validation
        run: dotnet run --project tools/AiUsage.ProjectValidation --no-build -- --root . --json --final
      - name: Preview release policy regressions
        shell: pwsh
        run: ./tests/release/Test-PreviewRelease.ps1
      - name: Product regression tests
        run: dotnet run --project tests/windows/AiUsage.Infrastructure.Tests -c Release -- -noLogo
      - name: Application workflow, presentation and dependency regressions
        run: dotnet run --project tests/windows/AiUsage.Presentation.Tests -c Release -- -noLogo

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
      REQUESTED_MSIX_VERSION: ${{ inputs.MsixVersion }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0; reads global.json
      - name: Build unsigned native MSIX
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content src/windows/AiUsage.Windows/Package.appxmanifest
          $version = if ($env:REQUESTED_MSIX_VERSION) { $env:REQUESTED_MSIX_VERSION } else { [string]$manifest.Package.Identity.Version }
          ./tools/windows/Build-Package.ps1 -MsixVersion $version -OutputDirectory .ai-usage-local/AIU-002/ci-packages
      - name: Publish isolated desktop smoke harness without running UI tests
        run: dotnet publish tests/windows/AiUsage.Windows.Tests/AiUsage.Windows.Tests.csproj -c Release -r win-x64 --self-contained true -o .ai-usage-local/AIU-002/ci-smoke
      - name: Record desktop evidence boundary
        shell: pwsh
        run: |
          '{"build":"PASS","interactiveSmoke":"NOT_RUN","installation":"NOT_RUN","artifact":"unsigned-validation-only"}' | Set-Content .ai-usage-local/AIU-002/ci-evidence.json
          Copy-Item tools/windows/Invoke-PackageSmoke.ps1 .ai-usage-local/AIU-002/ci-smoke/
      - name: Retain unsigned validation output only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-validation-only
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .ai-usage-local/AIU-002/ci-packages/*/*/AiUsage*.msix
            .ai-usage-local/AIU-002/ci-packages/*/*/Dependencies/x64/*.msix
            .ai-usage-local/AIU-002/ci-packages/*/*/Dependencies/x64/*.appx
            .ai-usage-local/AIU-002/ci-packages/*/package-evidence.json
            .ai-usage-local/AIU-002/ci-smoke/*
            .ai-usage-local/AIU-002/ci-evidence.json

  preview:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' && inputs.PublishPreview == true) && github.ref == 'refs/heads/main' && vars.AIU_PREVIEW_ENABLED == 'true'
    needs: [validate, windows-package]
    runs-on: windows-latest
    timeout-minutes: 30
    concurrency:
      group: development-preview-publication
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      - name: Decide Preview publication
        id: decide
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # OD-17: a push publishes unless every path changed since the build the feed serves is
          # non-product (docs/**, .claude/**, .agents/**, root *.md); an owner dispatch always publishes.
          # The base is the served build, not the newest release, so a run that failed after its release
          # went public still publishes on re-run. Any lookup failure publishes.
          Import-Module ./tools/windows/PreviewRelease.psm1 -Force
          $publish = $true
          $reason = 'owner dispatch'
          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $base = ''
            $feedDir = Join-Path $env:RUNNER_TEMP 'aiu-served-feed'
            New-Item -ItemType Directory -Force -Path $feedDir | Out-Null
            gh release download feed-preview --repo $env:GITHUB_REPOSITORY --pattern AiUsage.appinstaller --dir $feedDir --clobber
            if ($LASTEXITCODE -eq 0) {
              try {
                [xml]$served = Get-Content -Raw -LiteralPath (Join-Path $feedDir 'AiUsage.appinstaller')
                $base = [string](gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/preview-$($served.AppInstaller.Version)" --jq .target_commitish)
                if ($LASTEXITCODE -ne 0) { $base = '' }
              } catch { $base = '' }
            }
            $global:LASTEXITCODE = 0
            $ancestor = $false
            if ($base -match '^[0-9a-f]{40}$') {
              git merge-base --is-ancestor $base $env:GITHUB_SHA
              $ancestor = $LASTEXITCODE -eq 0
              $global:LASTEXITCODE = 0
            }
            if (!$ancestor) {
              $reason = "the served Preview's source is unknown or not an ancestor of this commit ($base)"
            } else {
              $changed = @(git diff --no-renames --name-only $base $env:GITHUB_SHA)
              if ($LASTEXITCODE -ne 0) { throw 'Cannot list changed paths.' }
              $publish = Test-PreviewInputsChanged -ChangedPaths $changed
              $reason = if ($publish) { "product inputs changed since the served Preview $base" } else { "only non-product paths changed since the served Preview $base ($($changed.Count) paths)" }
            }
          }
          "publish=$($publish.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "### Preview publication: $(if ($publish) { 'publish' } else { 'skip' })`n`nReason: $reason" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "Preview publication: $publish ($reason)"
      - name: Reserve, build, sign and publish development Preview
        if: steps.decide.outputs.publish == 'true'
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          AIU_CI_PFX_BASE64: ${{ secrets.AIU_CI_PFX_BASE64 }}
          AIU_CI_PFX_PASSWORD: ${{ secrets.AIU_CI_PFX_PASSWORD }}
        run: ./tools/windows/Publish-Preview.ps1 -SiteUrl https://rozputnii.github.io/ai-usage-app
      - name: Upload forward-only App Installer site
        if: steps.publish.outputs.promote == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ steps.publish.outputs.site }}
      - name: Deploy update feed
        if: steps.publish.outputs.promote == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
